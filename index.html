<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PH Farm - Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #134e5e, #71b280);
      --card-bg: rgba(255, 255, 255, 0.1);
      --card-border: rgba(255, 255, 255, 0.2);
      --accent-green: #2ecc71;
      --accent-gold: #f1c40f;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      background: var(--bg-gradient);
      color: #ffffff;
      margin: 0;
      padding: 10px;
      min-height: 100vh;
    }
    .header {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      padding: 12px;
      border-radius: 14px;
      margin-bottom: 10px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
    }
    .stats-row {
      display: flex;
      justify-content: space-around;
      margin-top: 8px;
      font-size: 13px;
      font-weight: bold;
    }
    .stat-badge {
      background: rgba(0, 0, 0, 0.25);
      padding: 4px 8px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .unlocked-banner {
      background: rgba(241, 196, 15, 0.2);
      border: 1px solid var(--accent-gold);
      color: #f39c12;
      padding: 6px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 10px;
      font-weight: bold;
    }
    /* 4x5 Farm Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      max-width: 400px;
      margin: 0 auto;
    }
    .plot {
      background: rgba(44, 62, 80, 0.7);
      backdrop-filter: blur(4px);
      border: 1.5px dashed rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      height: 85px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .plot:active {
      transform: scale(0.95);
    }
    .plot.locked {
      background: rgba(0, 0, 0, 0.4);
      border: 1.5px dashed rgba(255, 255, 255, 0.1);
      cursor: not-allowed;
    }
    .plot.growing {
      border: 2px solid #e67e22;
      background: rgba(230, 126, 34, 0.2);
    }
    .plot.ready {
      border: 2px solid var(--accent-green);
      background: rgba(46, 204, 113, 0.3);
      animation: pulse 1.2s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.03); }
    }
    .plot-icon {
      font-size: 26px;
      margin-bottom: 2px;
    }
    .plot-text {
      font-size: 10px;
      color: #ecf0f1;
      font-weight: 500;
      text-align: center;
      padding: 0 2px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2 id="welcome-msg" style="margin: 0 0 6px 0; font-size: 18px;">🌱 PH Farm</h2>
    <div class="stats-row">
      <div class="stat-badge">🪙 <span id="coin-count">100</span></div>
      <div class="stat-badge">⭐ Lvl <span id="level-num">1</span></div>
      <div class="stat-badge">📈 <span id="xp-count">0</span>/<span id="xp-target">200</span></div>
    </div>
  </div>

  <div id="unlock-info" class="unlocked-banner">
    🔓 Active Seed: <b>Wheat</b>
  </div>

  <div class="grid" id="farm-grid">
    <!-- 20 Plots generated dynamically -->
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('welcome-msg').innerText = `🌱 ${tg.initDataUnsafe.user.first_name}'s Farm`;
    }

    let coins = 100;
    let level = 1;
    let xp = 0;
    let xpTarget = 200;

    const crops = {
      1: { name: 'Wheat', icon: '🌾', cost: 15, reward: 28, time: 30, xpGain: 15 },
      2: { name: 'Tomato', icon: '🍅', cost: 40, reward: 80, time: 120, xpGain: 45 },
      3: { name: 'Golden Corn', icon: '🌽', cost: 90, reward: 190, time: 300, xpGain: 100 }
    };

    // 20 Plots (4x5 grid). Each plot specifies what level unlocks it.
    let plots = Array.from({ length: 20 }, (_, index) => ({
      id: index,
      state: 'empty', // 'locked', 'empty', 'growing', 'ready'
      plantedAt: null,
      requiredLevel: Math.floor(index / 4) + 1 // Row 1: Lvl 1, Row 2: Lvl 2, etc.
    }));

    function loadGame() {
      if (tg.CloudStorage) {
        tg.CloudStorage.getItem('ph_farm_save_v2', (err, value) => {
          if (!err && value) {
            try {
              const data = JSON.parse(value);
              coins = data.coins ?? 100;
              level = data.level ?? 1;
              xp = data.xp ?? 0;
              xpTarget = data.xpTarget ?? 200;
              if (data.plots) plots = data.plots;
              renderGrid();
            } catch (e) {}
          }
          renderGrid();
        });
      } else {
        renderGrid();
      }
    }

    function saveGame() {
      if (tg.CloudStorage) {
        tg.CloudStorage.setItem('ph_farm_save_v2', JSON.stringify({ coins, level, xp, xpTarget, plots }));
      }
    }

    function getCurrentCrop() {
      if (level >= 3) return crops[3];
      if (level === 2) return crops[2];
      return crops[1];
    }

    function renderGrid() {
      const gridContainer = document.getElementById('farm-grid');
      gridContainer.innerHTML = '';
      const activeCrop = getCurrentCrop();

      document.getElementById('coin-count').innerText = coins;
      document.getElementById('level-num').innerText = level;
      document.getElementById('xp-count').innerText = xp;
      document.getElementById('xp-target').innerText = xpTarget;
      document.getElementById('unlock-infoinnerHTML') = '';
      document.getElementById('unlock-info').innerHTML = `🔓 Active Seed: <b>${activeCrop.name} ${activeCrop.icon}</b>`;

      plots.forEach((plot, index) => {
        const plotDiv = document.createElement('div');
        
        // Determine plot lock status based on user level
        const isLocked = level < plot.requiredLevel;
        
        if (isLocked) {
          plotDiv.className = 'plot locked';
          plotDiv.innerHTML = `
            <div class="plot-icon">🔒</div>
            <div class="plot-text">Lvl ${plot.requiredLevel}</div>
          `;
        } else {
          plotDiv.className = `plot ${plot.state}`;
          plotDiv.onclick = () => handlePlotClick(index);

          if (plot.state === 'empty' || plot.state === 'locked') {
            plot.state = 'empty'; // unlock state if level met
            plotDiv.innerHTML = `
              <div class="plot-icon">🟫</div>
              <div class="plot-text">Plant (${activeCrop.cost}🪙)</div>
            `;
          } else if (plot.state === 'growing') {
            const timeLeft = Math.max(0, activeCrop.time - Math.floor((Date.now() - plot.plantedAt) / 1000));
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            const timeStr = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;

            plotDiv.innerHTML = `
              <div class="plot-icon">${activeCrop.icon}</div>
              <div class="plot-text">${timeStr}</div>
            `;
          } else if (plot.state === 'ready') {
            plotDiv.innerHTML = `
              <div class="plot-icon">${activeCrop.icon}</div>
              <div class="plot-text" style="color: #2ecc71; font-weight: bold;">Harvest!</div>
            `;
          }
        }
        gridContainer.appendChild(plotDiv);
      });
    }

    function handlePlotClick(index) {
      const plot = plots[index];
      if (level < plot.requiredLevel) return;

      const activeCrop = getCurrentCrop();

      if (plot.state === 'empty') {
        if (coins < activeCrop.cost) {
          alert("Not enough coins!");
          return;
        }
        coins -= activeCrop.cost;
        plot.state = 'growing';
        plot.plantedAt = Date.now();
        saveGame();
        renderGrid();
      } else if (plot.state === 'ready') {
        coins += activeCrop.reward;
        xp += activeCrop.xpGain;

        if (xp >= xpTarget) {
          level++;
          xp = 0;
          xpTarget += 250;
          alert(`🎉 Level Up! You reached Level ${level}! New plots and crops unlocked.`);
        }

        plot.state = 'empty';
        plot.plantedAt = null;
        saveGame();
        renderGrid();
      }
    }

    setInterval(() => {
      let needsRedraw = false;
      const activeCrop = getCurrentCrop();
      plots.forEach(plot => {
        if (plot.state === 'growing') {
          const elapsed = Math.floor((Date.now() - plot.plantedAt) / 1000);
          if (elapsed >= activeCrop.time) {
            plot.state = 'ready';
            saveGame();
            needsRedraw = true;
          } else {
            needsRedraw = true;
          }
        }
      });
      if (needsRedraw) renderGrid();
    }, 1000);

    loadGame();
  </script>
</body>
</html>
